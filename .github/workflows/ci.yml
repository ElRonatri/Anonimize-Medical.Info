name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) y tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Tesseract (para la prueba de OCR real)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
      - run: pip install -r requirements-dev.txt
      - name: pytest + cobertura (umbral en pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  test-ner:
    name: Tests NER (variante --ner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-ner.txt
      - name: "Pruebas con el modelo real (sin cobertura: el umbral lo controla el job principal)"
        run: pytest tests/test_ner.py tests/test_golden.py tests/test_anonymizer.py -q
      - name: Evaluación NER (cobertura y falsos positivos)
        run: python scripts/eval_ner.py --thresholds 0.8 | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-windows:
    name: Build Windows (${{ matrix.variant }})
    needs: [lint, test, test-ner, frontend]
    strategy:
      fail-fast: false
      matrix:
        # Regla del proyecto: los motores que agrandan el ejecutable son variantes opcionales.
        variant: [base, ocr, tesseract, ner]
    uses: ./.github/workflows/build-windows.yml
    with:
      variant: ${{ matrix.variant }}
