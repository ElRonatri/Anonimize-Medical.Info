name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) y tipos (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Tesseract (para la prueba de OCR real)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
      - run: pip install -r requirements-dev.txt
      - name: pytest + cobertura (umbral en pyproject.toml)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build-windows:
    name: Build Windows (PyInstaller) + autoprueba
    runs-on: windows-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interfaz
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean anonimize.spec
      - name: Autoprueba del ejecutable (sin ventana)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          $p = Start-Process -FilePath "dist\AnonimizeMedical\AnonimizeMedical.exe" `
                -ArgumentList "--self-test", "--self-test-report", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "La autoprueba falló (código $($p.ExitCode))" }
          $v = (Get-Item "dist\AnonimizeMedical\AnonimizeMedical.exe").VersionInfo.ProductVersion
          Write-Host "Versión del ejecutable: $v"
          if (-not $v) { throw "El ejecutable no tiene información de versión" }
      - uses: actions/upload-artifact@v4
        with:
          name: AnonimizeMedical-windows
          path: dist/AnonimizeMedical
          retention-days: 7
