[project]
name = "anonimize-medical"
description = "Anonimización local de documentos médicos (escritorio Windows, PyWebView)"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

# ---------------------------------------------------------------- lint
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["backend", "tests", "scripts"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["anonymizer", "api", "main", "make_samples"]

# ---------------------------------------------------------------- tipos
# Permisivo al inicio; se endurece por módulo (ver [[tool.mypy.overrides]]).
[tool.mypy]
python_version = "3.10"
files = ["backend"]
mypy_path = "backend"
# Modo estricto en todo el backend (bloque 7). Las dependencias opcionales sin tipos
# (rapidocr, spacy, pytesseract...) se tratan como Any.
strict = true
ignore_missing_imports = true
warn_unreachable = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
pythonpath = ["backend", "scripts"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
